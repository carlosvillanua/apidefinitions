asyncapi: '2.6.0'
info:
  title: User Signup Service
  version: '1.0.0'
  description: Publishes the UserSignedUp event when a new user account is created.
servers:
  production:
    url: mqtt://broker.example.com
    protocol: mqtt
channels:
  userSignedUp:
    description: Channel for user signup events
    subscribe:
      summary: Receive notification when a user signs up
      operationId: onUserSignedUp
      message:
        contentType: application/json
        payload:
          type: object
          properties:
            userId:
              type: string
              description: Unique identifier for the user
            email:
              type: string
              format: email
              description: User's email address
components:
  messages:
    UserSignedUp:
      name: UserSignedUp
      title: User Signed Up Event
      payload:
        type: object
        properties:
          userId:
            type: string
          email:
            type: string
            format: email
